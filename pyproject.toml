[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline-detector"
version = "0.1.0"
description = "Static, artifact-only detector of hollow verification evidence in a repository snapshot."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
plumbline-detect = "plumbline_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plumbline_detector = ["fingerprint.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "acceptance", ".venv"]
