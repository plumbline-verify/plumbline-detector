[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline-detector"
version = "0.1.0"
description = "Static, artifact-only detector of hollow verification evidence in a repository snapshot."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "tree-sitter>=0.25,<0.27", "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24"]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
plumbline-detect = "plumbline_detector.cli:main"
plumbline-diff = "plumbline_detector.cli:diff_main"
plumbline-pr = "plumbline_detector.cli:pr_main"
plumbline-scan = "plumbline_detector.scan:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plumbline_detector = ["fingerprint.json", "measurements.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "acceptance", ".venv"]
