name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y hunspell hunspell-en-us hunspell-en-gb
      - run: pip install -e '.[test]'
      - run: python -m pytest
      - run: python tools/check_us_spelling.py
